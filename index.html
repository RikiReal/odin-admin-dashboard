<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOP - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <form class="searchbar-container">
        <button type="submit" aria-label="Submit search">
          <span aria-hidden="true"></span>
        </button>
        <input
          type="search"
          placeholder="Search..."
          name="q"
          id="searchbar-input"
          aria-label="Search"
        />
        <label for="searchbar-input" hidden></label>
      </form>
      <div class="user-info">
        <span class="notifications-icon"></span>
        <img src="" alt="User profile picture" />
        <p class="user-name">Morgan Oakley</p>
      </div>
      <div class="user-greeting">
        <span alt="User profile picture" aria-hidden="true"></span>
        <div>
          <p class="greeting-intro">Hi there,</p>
          <p class="greeting-name">Morgan Oakley (@morgan)</p>
        </div>
      </div>
      <div class="header-buttons">
        <ul>
          <li>
            <button type="button">New</button>
          </li>
          <li>
            <button type="button">Upload</button>
          </li>
          <li>
            <button type="button">Share</button>
          </li>
        </ul>
      </div>
    </header>
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <!-- nav (and aside also) create their own section, so the header element here is the introduction to the navigation
         https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/header -->
        <header class="sidebar-title">
          <a href="#">
            <span aria-hidden="true"></span>
            <h1>Dashboard</h1>
          </a>
        </header>
        <ul>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Home
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Profile
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Messages
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              History
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Tasks
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Communities
            </a>
          </li>
        </ul>

        <ul class="sidebar-support-links">
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Settings
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Support
            </a>
          </li>
          <li>
            <a href="#">
              <span aria-hidden="true"></span>
              Privacy
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content"></main>
  </body>
</html>
